name: Export mockup data

# Writes the real inputs used by the formula mockup page to site/data/mockup_inputs.json and commits the file.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ingest/export_mockup_inputs.py"
      - ".github/workflows/export-mockup-data.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]>=3.2"
      - name: Export
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python ingest/export_mockup_inputs.py site/data/mockup_inputs.json
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/mockup_inputs.json
          git diff --cached --quiet || git commit -m "Update mockup inputs from the database"
          git push
